[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-calling-data-generation"
version = "0.1.0"
description = "Standalone tool-calling SFT/DPO dataset generation pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate>=1.0",
  "datasets>=5.0,<6",
  "fsspec[http]>=2024.6.1,<=2025.9.0",
  "huggingface-hub>=0.34,<2",
  "json-repair>=0.39",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=21",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scipy>=1.12",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=4.57,<6",
]

[project.optional-dependencies]
vllm = ["vllm"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
tool-data-gen = "tool_calling_data_generation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_calling_data_generation*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
